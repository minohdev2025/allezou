# Tunnel nommé sur r4c.app — c'est celui-ci qu'on utilise.
#
#   npm run demo:tunnel:nomme
#
# La zone r4c.app est passée chez Cloudflare, ses enregistrements de messagerie compris
# (MX, SPF, DMARC et la délégation _domainkey vers Infomaniak). L'adresse est stable : une
# application ajoutée à un écran d'accueil le reste, et les codes QR restent valables.
#
# Deux pièges rencontrés en chemin, si la route DNS est à refaire un jour :
#
#   cloudflared tunnel route dns c03a77d6-2588-4aed-b21d-0fa17b9eb23f r4c.app
#
#  - Donner l'identifiant et non le nom : sinon ~/.cloudflared/config.yml prend le dessus et
#    la route part vers le tunnel de LiNQ.
#  - Le fichier cert.pem est lié à UNE zone. Tant qu'il était celui de linq-a.ch, cloudflared
#    créait `r4c.app.linq-a.ch` au lieu de l'apex. Il a fallu le mettre de côté
#    (cert-linq.pem) et refaire `cloudflared tunnel login` en choisissant r4c.app.
#    Les tunnels qui tournent ne s'en aperçoivent pas : ils utilisent leur fichier de
#    credentials JSON, pas cert.pem.

tunnel: c03a77d6-2588-4aed-b21d-0fa17b9eb23f
credentials-file: C:\Users\Admin\.cloudflared\c03a77d6-2588-4aed-b21d-0fa17b9eb23f.json

ingress:
  - hostname: r4c.app
    service: http://localhost:3000
  - service: http_status:404
