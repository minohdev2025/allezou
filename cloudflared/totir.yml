# Tunnel nommé — INUTILISÉ POUR L'INSTANT.
#
# Il ne servira que le jour où la zone `r4c.app` sera gérée par Cloudflare. Aujourd'hui elle
# est chez Infomaniak, et un tunnel nommé s'expose via `<identifiant>.cfargotunnel.com`, un
# nom qui ne résout que dans le DNS de Cloudflare : un CNAME depuis Infomaniak n'y arriverait
# pas. Il n'y a pas de demi-mesure.
#
# En attendant, les démonstrations passent par un tunnel éphémère, sans aucun DNS :
#
#   npm run demo:tunnel
#
# Le jour où la zone déménage chez Cloudflare :
#
#   cloudflared tunnel route dns c03a77d6-2588-4aed-b21d-0fa17b9eb23f r4c.app
#   npm run demo:tunnel:nomme
#
# (Donner l'identifiant et non le nom : `~/.cloudflared/config.yml` prend sinon le dessus et
# la route part vers le tunnel de LiNQ.)

tunnel: c03a77d6-2588-4aed-b21d-0fa17b9eb23f
credentials-file: C:\Users\Admin\.cloudflared\c03a77d6-2588-4aed-b21d-0fa17b9eb23f.json

ingress:
  - hostname: r4c.app
    service: http://localhost:3000
  - service: http_status:404
